specVersion: 1.2.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: {{dataSourceName}}
    network: {{network}}
    source:
      address: "{{address}}"
      abi: {{abiName}}
      startBlock: {{startBlock}}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - TokenFactory
        - Token
        - TokenCreatedEvent
      abis:
        - name: {{abiName}}
          file: ./abis/{{abiFile}}
        - name: L2SuperChainToken
          file: ./abis/L2SuperChainToken.json
        - name: L1Token
          file: ./abis/L1Token.json
      eventHandlers:
        - event: {{eventSignature}}
          handler: {{handler}}
      file: ./src/{{mappingFile}}

{{#hasL1TokenTemplate}}
templates:
  - kind: ethereum
    name: L1Token
    network: {{network}}
    source:
      abi: L1Token
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Token
        - PendingOwnershipTransfer
      abis:
        - name: L1Token
          file: ./abis/L1Token.json
      eventHandlers:
        - event: OwnershipTransferStarted(indexed address,indexed address)
          handler: handleOwnershipTransferStarted
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
      file: ./src/l1-token.ts
{{/hasL1TokenTemplate}}

{{#hasL2TokenTemplate}}
templates:
  - kind: ethereum
    name: L2SuperChainToken
    network: {{network}}
    source:
      abi: L2SuperChainToken
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Token
        - PendingOwnershipTransfer
      abis:
        - name: L2SuperChainToken
          file: ./abis/L2SuperChainToken.json
      eventHandlers:
        - event: RemoteTokenUpdated(indexed address)
          handler: handleRemoteTokenUpdated
        - event: BridgeUpdated(indexed address)
          handler: handleBridgeUpdated
        - event: OwnershipTransferStarted(indexed address,indexed address)
          handler: handleOwnershipTransferStarted
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
      file: ./src/l2-token.ts
{{/hasL2TokenTemplate}}
