# Token Factory entity - tracks both L1 and L2 factories
type TokenFactory @entity {
  id: Bytes! # Factory address
  chain: String! # "ethereum" or "celo"
  tokenCount: BigInt!
  tokens: [Token!]! @derivedFrom(field: "factory")
  createdAt: BigInt!
  updatedAt: BigInt!
}

# Token entity - represents tokens created by factories
type Token @entity {
  id: Bytes! # Token address
  factory: TokenFactory!
  tokenAddress: Bytes!
  name: String!
  symbol: String!
  decimals: Int!
  initialSupply: BigInt!
  maxSupply: BigInt!
  totalSupply: BigInt! # Current circulating supply
  totalUniqueHolders: BigInt! # Number of unique addresses holding this token
  totalTransfers: BigInt! # Total number of transfer events
  totalBridges: BigInt! # Total number of bridge events (crosschain mint/burn)
  owner: Bytes!
  chain: String! # "ethereum" or "celo"
  # IPFS URI pointing to token metadata JSON (e.g., "ipfs://Qm...")
  metadataURI: String
  # For L2 tokens that have a remote L1 token
  remoteToken: Bytes
  # Bridge configuration
  bridge: Bytes
  holders: [TokenHolder!]! @derivedFrom(field: "token")
  transfers: [TransferEvent!]! @derivedFrom(field: "token")
  bridgeEvents: [BridgeEvent!]! @derivedFrom(field: "token")
  createdAt: BigInt!
  createdAtBlock: BigInt!
  createdTxHash: Bytes!
}

# TokenHolder entity - tracks each holder's balance for a token
type TokenHolder @entity {
  id: Bytes! # tokenAddress + holderAddress
  token: Token!
  holder: Bytes!
  balance: BigInt!
}

# TokenCreated event entity for historical tracking
type TokenCreatedEvent @entity(immutable: true) {
  id: Bytes!
  factory: Bytes!
  tokenAddress: Bytes!
  name: String!
  symbol: String!
  decimals: Int!
  initialSupply: BigInt!
  maxSupply: BigInt!
  owner: Bytes!
  metadataURI: String
  chain: String!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# Pending ownership transfer entity - tracks ownership transfers in progress
type PendingOwnershipTransfer @entity {
  id: Bytes! # token address (since only one pending transfer can exist per token)
  token: Token!
  previousOwner: Bytes!
  newOwner: Bytes!
  createdAt: BigInt!
  createdAtBlock: BigInt!
  createdTxHash: Bytes!
}

# TransferEvent entity - tracks individual transfer events
type TransferEvent @entity(immutable: true) {
  id: Bytes! # txHash + logIndex
  token: Token!
  from: Bytes!
  to: Bytes!
  value: BigInt!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

# BridgeEvent entity - tracks crosschain mint/burn events
type BridgeEvent @entity(immutable: true) {
  id: Bytes! # txHash + logIndex
  token: Token!
  eventType: String! # "mint" or "burn"
  account: Bytes! # "to" for mint, "from" for burn
  amount: BigInt!
  sender: Bytes! # The bridge/messenger that initiated the crosschain operation
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}
