specVersion: 1.2.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: L2SuperChainTokenFactory
    network: celo-sepolia
    source:
      address: "0xda572dDA586970a0b844d2E7a2e55fe3af35b225"
      abi: L2SuperChainTokenFactory
      startBlock: 16713308
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - TokenFactory
        - Token
        - TokenCreatedEvent
      abis:
        - name: L2SuperChainTokenFactory
          file: ./abis/L2SuperChainTokenFactory.json
        - name: L2SuperChainToken
          file: ./abis/L2SuperChainToken.json
      eventHandlers:
        - event: TokenCreated(indexed address,string,string,uint8,uint256,uint256,indexed address)
          handler: handleL2TokenCreated
      file: ./src/l2-token-factory.ts

templates:
  - kind: ethereum
    name: L2SuperChainToken
    network: celo-sepolia
    source:
      abi: L2SuperChainToken
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Token
      abis:
        - name: L2SuperChainToken
          file: ./abis/L2SuperChainToken.json
      eventHandlers:
        - event: RemoteTokenUpdated(indexed address)
          handler: handleRemoteTokenUpdated
        - event: BridgeUpdated(indexed address)
          handler: handleBridgeUpdated
      file: ./src/l2-token.ts
