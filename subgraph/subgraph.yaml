specVersion: 1.2.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: L1TokenFactory
    network: mainnet
    source:
      address: "0xa7763537F4C1F321C31AaAc2a2e3b5c674f568D2"
      abi: L1TokenFactory
      startBlock: 24421550
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - TokenFactory
        - Token
        - TokenCreatedEvent
      abis:
        - name: L1TokenFactory
          file: ./abis/L1TokenFactory.json
        - name: L2SuperChainToken
          file: ./abis/L2SuperChainToken.json
        - name: L1Token
          file: ./abis/L1Token.json
      eventHandlers:
        - event: TokenCreated(indexed address,string,string,uint256,uint256,uint8,indexed address)
          handler: handleL1TokenCreated
      file: ./src/l1-token-factory.ts

templates:
  - kind: ethereum
    name: L1Token
    network: mainnet
    source:
      abi: L1Token
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Token
        - TokenHolder
        - PendingOwnershipTransfer
        - TransferEvent
        - BridgeEvent
      abis:
        - name: L1Token
          file: ./abis/L1Token.json
      eventHandlers:
        - event: OwnershipTransferStarted(indexed address,indexed address)
          handler: handleOwnershipTransferStarted
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: ./src/l1-token.ts

